name: OrangeFox - Build A31

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Free space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev lib32z1-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3 python3-pip schedtool

    - name: Sync Fox 12.1
      run: |
        mkdir -p ~/fox && cd ~/fox
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox/fox_12.1

    - name: Clone A31 tree with official touch fix
      run: |
        cd ~/fox/fox_12.1
        git clone https://github.com/Galaxy-MT6768/android_device_samsung_a31x -b android-12 device/samsung/a31
        # 7 saniye logo fix - dokunmatik
        echo "TW_SCREEN_BLANK_ON_BOOT := true" >> device/samsung/a31/BoardConfig.mk
        echo "TW_DELAY_TOUCH_INIT_MS := 7000" >> device/samsung/a31/BoardConfig.mk

    - name: Build
      run: |
        cd ~/fox/fox_12.1
        source build/envsetup.sh
        lunch twrp_a31-eng
        mka recoveryimage -j$(nproc --all)

    - name: Make OrangeFox zip
      run: |
        cd ~/fox/fox_12.1
        mka adbd
        cp out/target/product/a31/recovery.img OrangeFox-A31-OfficialTouchFix.img
        ls -lh *.img

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-A31-Fixed
        path: ~/fox/fox_12.1/*.img
