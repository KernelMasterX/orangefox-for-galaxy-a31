name: Tema Ara 2

on:
  workflow_dispatch:

jobs:
  grep:
    runs-on: ubuntu-22.04
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Repo listesi
        run: |
          for q in recovery bootable theme; do
            echo "=== search: $q ==="
            curl -s "https://gitlab.com/api/v4/groups/OrangeFox/projects?search=$q&include_subgroups=true&per_page=50" \
              | python3 -c "import sys,json; [print(p['path_with_namespace'], '|', p.get('default_branch')) for p in json.load(sys.stdin)]"
          done

      - name: Manifest ipucu
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git sync
          grep -nE "manifest|MANIFEST|gitlab|git clone|repo init" sync/orangefox_sync.sh | head -30

      - name: Vendor tema
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/vendor/recovery.git vendor
          {
            echo "=== theme_installer ==="
            find vendor/theme_installer -maxdepth 3 | head -40
            echo
            echo "=== changelog: dark/theme/light ==="
            grep -niE "dark|light|theme" vendor/Files/changelog.txt | head -40
            echo
            echo "=== vendor metin dosyalarinda tema bayragi ==="
            grep -rnE "(dark|light|theme)" vendor --include=*.mk --include=*.sh --include=*.prop --include=*.cpp --include=*.xml --include=*.md | head -40
          } 2>&1 | tee vendor_tema.txt

      - name: Bootable recovery dene
        run: |
          for repo in OrangeFox/Recovery OrangeFox/bootable_recovery OrangeFox/recovery; do
            for br in fox_12.1 master main; do
              if git clone --depth=1 -b $br https://gitlab.com/$repo.git rec 2>/dev/null; then
                echo "KLONLANDI: $repo ($br)"
                break 2
              fi
            done
          done
          if [ -d rec ]; then
            {
              echo "=== gui icinde dark ==="
              grep -rliE "dark" rec/gui | head -20
              echo
              echo "=== varsayilan tema satirlari ==="
              grep -rnE "(dark|light).{0,40}(default|value)|(default|value).{0,40}(dark|light)" rec/gui | head -40
              echo
              echo "=== ayar degiskenleri ==="
              grep -rnE "(of_|fox_).{0,30}(dark|light|theme)|theme_?(name|style)" rec --include=*.cpp --include=*.xml --include=*.mk | head -40
            } 2>&1 | tee rec_tema.txt
          else
            echo "REC KLONLANAMADI, yukaridaki repo listesine bak"
          fi
