name: OrangeFox - Build A31 - Custom Fork

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git-core git-lfs gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev lib32z1-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            python3 python3-pip python-is-python3 schedtool lz4 libncurses5 rsync bc ccache
          git config --global user.name "runner"
          git config --global user.email "runner@github.com"
          git config --global color.ui false
          mkdir -p $HOME/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > $HOME/.bin/repo
          chmod a+x $HOME/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync Fox 12.1
        run: |
          mkdir -p /home/runner/fox
          git clone https://gitlab.com/OrangeFox/sync.git /home/runner/fox/sync
          cd /home/runner/fox/sync
          ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox/fox_12.1
          test -f /home/runner/fox/fox_12.1/build/envsetup.sh || { echo "SYNC BOZUK: envsetup.sh yok"; exit 1; }
          ls -lh /home/runner/fox/fox_12.1

      - name: Clone A31 tree
        run: |
          cd /home/runner/fox/fox_12.1
          rm -rf device/samsung/a31
          git clone https://github.com/KernelMasterX/orangefox-for-galaxy-a31.git device/samsung/a31
          echo "TW_SCREEN_BLANK_ON_BOOT := true" >> device/samsung/a31/BoardConfig.mk
          echo "=== TREE ==="
          ls -la device/samsung/a31/
          echo "=== AndroidProducts.mk ==="
          cat device/samsung/a31/AndroidProducts.mk || echo "AndroidProducts.mk YOK"

      - name: Build
        shell: bash {0}
        run: |
          cd /home/runner/fox/fox_12.1 || { echo "CD BASARISIZ"; exit 1; }
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=a31
          export LC_ALL=C
          export USE_CCACHE=1

          source build/envsetup.sh
          echo "envsetup rc=$?"

          lunch twrp_a31-eng
          LUNCH_RC=$?
          echo "lunch rc=$LUNCH_RC"
          if [ $LUNCH_RC -ne 0 ]; then
            echo "LUNCH PATLADI: urun adi tree ile uyusmuyor"
            exit 1
          fi

          mka adbd recoveryimage -j4 2>&1 | tee /home/runner/build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "build rc=$BUILD_RC"
          if [ $BUILD_RC -ne 0 ]; then
            echo "=== HATA SATIRLARI ==="
            grep -nE "error:|FAILED:|fatal|No rule to make target" /home/runner/build.log | head -30
            echo "=== SON 60 SATIR ==="
            tail -60 /home/runner/build.log
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: ignore
          path: /home/runner/build.log

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A31-Custom
          if-no-files-found: warn
          path: |
            /home/runner/fox/fox_12.1/out/target/product/a31/OrangeFox*.zip
            /home/runner/fox/fox_12.1/out/target/product/a31/recovery.img
