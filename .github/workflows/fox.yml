name: OrangeFox - Build A31

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3 python3-pip schedtool lz4
          curl https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          git config --global user.name "runner"
          git config --global user.email "runner@github.com"

      - name: Sync Fox 12.1
        run: |
          mkdir -p /home/runner/fox
          cd /home/runner/fox
          git clone https://gitlab.com/OrangeFox/sync.git --depth=1
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox/fox_12.1

      - name: Clone A31 tree with official touch fix
        run: |
          cd /home/runner/fox/fox_12.1
          rm -rf device/samsung/a31 device/samsung/a31x
          git clone https://github.com/Galaxy-MT6768/android_device_samsung_a31x -b android-12.1 device/samsung/a31x
          echo "TW_SCREEN_BLANK_ON_BOOT := true" >> device/samsung/a31x/BoardConfig.mk
          echo "TW_DELAY_TOUCH_INIT_MS := 7000" >> device/samsung/a31x/BoardConfig.mk
          ls device/samsung/a31x/*.mk

      - name: Build
        run: |
          cd /home/runner/fox/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=a31x
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_a31x-eng
          mka adbd recoveryimage -j$(nproc --all)

      - name: Make OrangeFox zip
        run: |
          cd /home/runner/fox/fox_12.1
          find out/target/product/a31x -maxdepth 1 -type f | head -30
          cp out/target/product/a31x/OrangeFox*.zip ./ || true
          cp out/target/product/a31x/recovery.img ./OrangeFox-A31-OfficialTouchFix.img || true
          ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A31-Fixed
          path: |
            /home/runner/fox/fox_12.1/OrangeFox*.zip
            /home/runner/fox/fox_12.1/*.img
